<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Face AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 9999;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 15px 30px;

      font-size: 20px;

      border: none;
      border-radius: 10px;

      background: white;
      color: black;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ปุ่มเปิดกล้อง -->
  <button id="startButton">
    เปิดกล้อง
  </button>

  <a-scene
    mindar-face="autoStart: false; uiScanning: yes;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera></a-camera>

    <!-- จุดจับใบหน้า -->
    <a-entity mindar-face-target="anchorIndex: 1">

      <!-- รูปของเรา -->
      <a-image
        src="./images/face.png"
        position="0 0.5 0"
        width="1"
        height="1"
        transparent="true">
      </a-image>

    </a-entity>

  </a-scene>

  <script>

    const button = document.getElementById("startButton");
    const scene = document.querySelector("a-scene");

    button.addEventListener("click", async () => {

      button.style.display = "none";

      const mindar =
        scene.systems["mindar-face-system"];

      try {

        await mindar.start();

      } catch (error) {

        console.error(error);

        alert(
          "เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง"
        );

        button.style.display = "block";
      }

    });

  </script>

</body>
</html>
